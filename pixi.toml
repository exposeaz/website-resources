[workspace]
authors = ["Stephanie J. Spielman <stephanie.spielman@gmail.com>"]
channels = ["conda-forge"]
name = "website-resources"
# linux-64 for the GitHub Actions runner
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
dry-run = { cmd = "python -m substack_pipeline --dry-run", cwd = "update-substack-posts" }
pipeline = { cmd = "python -m substack_pipeline", cwd = "update-substack-posts" }
tag-stats = { cmd = "python -m substack_pipeline.tag_stats", cwd = "update-substack-posts" }
export = { cmd = "python -m substack_pipeline.export", cwd = "update-substack-posts" }
pr-body = { cmd = "python -m substack_pipeline.pr_body", cwd = "update-substack-posts" }
retag = { cmd = "python -m substack_pipeline.retag", cwd = "update-substack-posts" }
retag-full-text = { cmd = "python -m substack_pipeline.retag --full-text", cwd = "update-substack-posts" }
tag-review = { cmd = "python -m substack_pipeline.tag_review", cwd = "update-substack-posts" }
dedupe = { cmd = "python -m substack_pipeline.dedupe", cwd = "update-substack-posts" }
fill = { cmd = "python -m substack_pipeline.fill", cwd = "update-substack-posts" }
add-resource = { cmd = "python -m substack_pipeline.add_resource", cwd = "update-substack-posts" }
export-sync = { cmd = "python -m substack_pipeline.export --sync", cwd = "update-substack-posts" }

[dependencies]
python = "3.13.*"

[pypi-dependencies]
anthropic = ">=2.3.0,<3"
beautifulsoup4 = ">=4.15.0,<5"
feedparser = ">=6.0.14,<7"
# feedparser falls back to this lenient parser for malformed feeds; not always installed with it
sgmllib3k = ">=1.0.0,<2"
pyyaml = ">=6.0.3,<7"
requests = ">=2.34.2,<3"
